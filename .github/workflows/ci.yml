name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      # Offline: Fiscal Data responses replay from tests/cassettes/, and the
      # ground-truth eval replays eval/fixtures/ (tests/test_eval.py).
      - name: Run tests and offline eval
        run: uv run pytest tests/ -v

[project]
name = "trorbot-mcp"
version = "0.1.0"
description = "MCP server exposing Treasury receivables data, program context, and annual report insights"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.44.9",
    "fastmcp>=2.3.4",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.scripts]
trorbot-mcp = "trorbot_mcp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trorbot_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.23.1",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
